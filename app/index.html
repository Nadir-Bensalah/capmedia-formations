<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma formation · Capmedia Academy</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/az.css">
<link rel="stylesheet" href="../assets/css/lecture.css">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<script>
  (function () {
    try {
      var t = localStorage.getItem('az:theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>

<!-- ── Écran d'attente ─────────────────────────────────────────────────── -->
<div class="voile" id="voile">
  <div class="rang" style="justify-content:center">
    <svg class="tourne" width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="var(--texte-3)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
      <path d="M12 3a9 9 0 1 0 9 9"/>
    </svg>
    <span class="t-petit t-2" id="voile-texte">Vérification de ton accès…</span>
  </div>
</div>

<!-- ── Barre mobile ────────────────────────────────────────────────────── -->
<div class="barre-app">
  <button class="bouton-icone" id="ouvrir-menu" aria-label="Ouvrir le sommaire">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <span class="logo" style="font-size:14px"><span class="marque" style="width:20px;height:20px;font-size:12px">C</span>Capmedia&nbsp;Academy</span>
</div>

<div class="agencement">

  <!-- ── Sommaire ──────────────────────────────────────────────────────── -->
  <aside class="sommaire" id="sommaire">
    <div class="sommaire-haut">
      <a href="../" class="logo"><img class="marque" src="../assets/img/logo-academy.png" alt="" width="22" height="22">Capmedia&nbsp;Academy</a>
      <button class="bouton-icone mobile-seul" id="fermer-menu" aria-label="Fermer le sommaire">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="sommaire-progression">
      <div class="rang-espace">
        <span class="t-micro t-2">Ta progression</span>
        <span class="t-micro t-3 t-nb" id="progression-texte">0/0</span>
      </div>
      <div class="jauge"><span id="jauge"></span></div>
    </div>

    <nav class="liens-modules" id="liens-modules" aria-label="Modules de la formation"></nav>

    <div class="sommaire-bas">
      <button type="button" class="lien-module" id="ouvrir-formations">
        <span class="num"><svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
        <span class="titre-module">Mes formations</span>
      </button>
      <button type="button" class="lien-module" id="ouvrir-sos">
        <span class="num"><svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><path d="M4.9 4.9l4.2 4.2"/><path d="M14.9 14.9l4.2 4.2"/><path d="M14.9 9.1l4.2-4.2"/><path d="M4.9 19.1l4.2-4.2"/></svg></span>
        <span class="titre-module">SOS Erreurs</span>
      </button>
      <button type="button" class="lien-module" id="ouvrir-support">
        <span class="num"><svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg></span>
        <span class="titre-module">Aide, support &amp; avis</span>
      </button>
      <button type="button" class="lien-module" id="ouvrir-profil">
        <span class="num"><svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
        <span class="titre-module">Matériel &amp; mode</span>
      </button>
      <span class="t-micro t-3" id="email-membre"></span>
      <div class="rang-espace">
        <button class="lien-nu" id="deconnexion">Se déconnecter</button>
        <div class="selecteur-theme" role="group" aria-label="Langue du contenu" style="padding:2px" id="sel-langue-app">
          <button type="button" data-langue-val="fr" aria-pressed="true" style="padding:2px 8px;font-size:11px">FR</button>
          <button type="button" data-langue-val="en" aria-pressed="false" style="padding:2px 8px;font-size:11px">EN</button>
        </div>
        <div class="selecteur-theme" role="group" aria-label="Thème" style="padding:2px">
          <button type="button" data-theme-val="light" aria-pressed="false" style="padding:2px 6px;font-size:11px">Clair</button>
          <button type="button" data-theme-val="dark" aria-pressed="false" style="padding:2px 6px;font-size:11px">Sombre</button>
          <button type="button" data-theme-val="auto" aria-pressed="true" style="padding:2px 6px;font-size:11px">Auto</button>
        </div>
      </div>
    </div>
  </aside>

  <div class="ombre-menu" id="ombre-menu"></div>

  <!-- ── Lecture ───────────────────────────────────────────────────────── -->
  <main class="lecture" id="lecture">
    <article class="page" id="page"></article>

    <nav class="pagination" id="pagination" aria-label="Module précédent et suivant"></nav>

    <!-- Suite du parcours : formation suivante, panneau pack ou fin -->
    <div id="suite-parcours" style="max-width:var(--colonne-lecture);margin:0 auto;padding:0 var(--marge-mobile) var(--e-7)"></div>

    <footer class="pied-lecture">
      Formation Capmedia Academy · usage strictement personnel ·
      <a href="mailto:contact@capmedia.tn">une question&nbsp;?</a>
    </footer>
  </main>

</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/cookies.js"></script>
<script type="module" src="../assets/js/app.js"></script>
</body>
</html>
