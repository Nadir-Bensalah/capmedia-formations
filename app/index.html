<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma formation — Atelier Zéro</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBFAF8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/atelier.css">
<link rel="stylesheet" href="../assets/css/lecture.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2314130F'/><text y='72' x='50' text-anchor='middle' font-size='62' font-family='Georgia,serif' fill='%23FBFAF8'>Z</text></svg>">
</head>
<body class="corps-app">

<!-- ── Écran d'attente ─────────────────────────────────────────────────── -->
<div class="voile" id="voile">
  <div class="pile pile-16 t-centre">
    <svg class="tourne" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--encre-tenue)" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
    <p class="t-petit t-douce" id="voile-texte">Vérification de ton accès…</p>
  </div>
</div>

<!-- ── Barre mobile ────────────────────────────────────────────────────── -->
<div class="barre-app">
  <button class="bouton-icone" id="ouvrir-menu" aria-label="Ouvrir le sommaire">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <span class="logo" style="font-size:.9rem"><span class="marque" style="width:22px;height:22px;font-size:.85rem">Z</span> Atelier&nbsp;Zéro</span>
  <span style="width:38px"></span>
</div>

<div class="agencement">

  <!-- ── Sommaire ──────────────────────────────────────────────────────── -->
  <aside class="sommaire" id="sommaire">
    <div class="sommaire-haut">
      <a href="../index.html" class="logo"><span class="marque">Z</span> Atelier&nbsp;Zéro</a>
      <button class="bouton-icone masque-bureau" id="fermer-menu" aria-label="Fermer le sommaire">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="progression">
      <div class="rang rang--espace">
        <span class="t-micro" style="font-weight:600">Ta progression</span>
        <span class="t-micro t-tenue" id="progression-texte">0 / 12</span>
      </div>
      <div class="jauge"><div class="jauge-remplie" id="jauge"></div></div>
    </div>

    <nav class="liens-modules" id="liens-modules"></nav>

    <div class="sommaire-bas">
      <div class="pile pile-8">
        <span class="t-micro t-tenue" id="email-membre"></span>
        <button class="lien-nu t-micro" id="deconnexion">Se déconnecter</button>
      </div>
    </div>
  </aside>

  <div class="ombre-menu" id="ombre-menu"></div>

  <!-- ── Lecture ───────────────────────────────────────────────────────── -->
  <main class="lecture" id="lecture">
    <article class="page" id="page"></article>

    <nav class="pagination" id="pagination"></nav>

    <footer class="pied-lecture">
      <p class="t-micro t-tenue">
        Formation Atelier Zéro · usage strictement personnel ·
        <a href="mailto:contact@atelier-zero.fr">une question&nbsp;?</a>
      </p>
    </footer>
  </main>

</div>

<script src="../assets/js/config.js"></script>
<script type="module" src="../assets/js/app.js"></script>
</body>
</html>
