<!DOCTYPE html>
<html lang="fr" data-suite>
<head>
<meta charset="utf-8">
<!-- Politique de sécurité du contenu : docs/suivi.md, « En-têtes de sécurité ».
     En production, le .htaccess envoie la même sans 127.0.0.1 (le banc local),
     et le navigateur applique les deux : c'est la plus stricte qui gagne. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com/firebasejs/10.13.2/; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://storage.googleapis.com https://www.google.com/images/cleardot.gif http://127.0.0.1:*; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebasestorage.googleapis.com https://europe-west1-capmedia-1f90d.cloudfunctions.net http://127.0.0.1:*; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capmedia Cockpit</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111113">
<link rel="stylesheet" href="./assets/css/hub.css">
<link rel="stylesheet" href="./assets/css/suite.css">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-agence-32.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-agence.png">
<!-- Sombre par défaut, avant le premier pixel (theme-espace.js reprend ensuite). -->
<script src="./assets/js/theme-avant.js" data-cle="suivi:cockpit-theme"></script>
</head>
<body>
<!-- L'écran de lancement : la marque s'assemble, puis rejoint sa place
     (lancement.js). Le même sur le web et dans les applications. -->
<div class="lancement" id="lancement" aria-hidden="true">
  <div class="accueil-logo"><i class="feuille feuille--1"></i><i class="feuille feuille--2"></i><i class="feuille feuille--3"></i><i class="feuille feuille--4"></i><span class="halo"></span></div>
  <p class="lancement-mot">Capmedia</p>
</div>
<div id="racine">
  <div class="porte">
    <div class="porte-boite" role="status" aria-live="polite">
      <div class="marque">Capmedia</div>
      <div class="squelette"><div class="os os--titre"></div><div class="os os--texte"></div><div class="os os--court"></div></div>
    </div>
  </div>
</div>
<script src="./assets/js/lancement.js"></script>
<script src="./assets/js/config-suivi.js"></script>
<script src="./assets/js/theme-espace.js" data-cle="suivi:cockpit-theme"></script>
<script type="module" src="./assets/js/admin.js"></script>
</body>
</html>
