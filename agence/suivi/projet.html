<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi de projet · Capmedia Digital</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/az.css">
<link rel="stylesheet" href="./assets/suivi.css">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-agence-32.png">
<script>(function(){try{var t=localStorage.getItem('az:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>

<a class="saut-contenu" href="#vue">Aller au contenu</a>

<div class="appli">

  <!-- La barre du haut : le projet à gauche, le compte à droite -->
  <header class="appli-barre">
    <p class="appli-marque" id="nom-projet">Espace de suivi</p>
    <div class="appli-fin">
      <span class="t-micro t-3 masque-etroit" id="courriel-compte"></span>
      <button class="btn btn-fantome" type="button" id="deconnexion">Se déconnecter</button>
    </div>
  </header>

  <div class="appli-corps">

    <!-- La navigation -->
    <aside class="appli-lateral">

      <div id="bloc-projets" class="masque" style="margin-bottom:var(--e-4)">
        <label class="etiquette-champ" for="choix-projet">Projet</label>
        <select class="champ" id="choix-projet"></select>
      </div>

      <nav class="nav-suivi" id="nav" aria-label="Sections de l'espace">
        <button type="button" class="actif" data-vue="tickets" aria-current="page">
          Tickets <span class="compte" id="compte-tickets" aria-hidden="true"></span>
        </button>
        <button type="button" data-vue="documents">
          Devis et factures <span class="compte" id="compte-documents" aria-hidden="true"></span>
        </button>
        <a href="../">Retour au site</a>
      </nav>

      <hr class="filet">
      <div class="selecteur-theme" role="group" aria-label="Thème">
        <button type="button" data-theme-val="light" aria-pressed="false">Clair</button>
        <button type="button" data-theme-val="dark" aria-pressed="false">Sombre</button>
        <button type="button" data-theme-val="auto" aria-pressed="true">Auto</button>
      </div>
    </aside>

    <!-- Le contenu -->
    <main class="appli-vue" id="vue">

      <section class="tuiles" id="tuiles" aria-live="polite" aria-label="Chiffres du projet">
        <div class="tuile">
          <p class="tuile-valeur" id="tuile-ouverts">0</p>
          <p class="tuile-libelle">Tickets ouverts</p>
        </div>
        <div class="tuile">
          <p class="tuile-valeur" id="tuile-attente">0</p>
          <p class="tuile-libelle">Attendent votre réponse</p>
        </div>
        <div class="tuile">
          <p class="tuile-valeur" id="tuile-resolus">0</p>
          <p class="tuile-libelle">Tickets résolus</p>
        </div>
        <div class="tuile">
          <p class="tuile-valeur" id="tuile-factures">0</p>
          <p class="tuile-libelle">Factures à payer</p>
        </div>
      </section>

      <!-- ===== Vue Tickets ===== -->
      <section id="vue-tickets" style="margin-top:var(--e-6)">

        <div class="rang-espace">
          <h1 class="t-h2">Tickets</h1>
          <button class="btn btn-principal" type="button" id="ouvrir-creation"
                  aria-expanded="false" aria-controls="carte-creation">Signaler une anomalie</button>
        </div>

        <!-- Le formulaire de création, replié par défaut -->
        <section class="carte masque" id="carte-creation" style="margin-top:var(--e-5)" aria-label="Nouveau ticket">
          <form id="forme-ticket" class="grille" novalidate>

            <div>
              <label class="etiquette-champ" for="titre">Titre <span class="t-3">(obligatoire)</span></label>
              <input class="champ" type="text" id="titre" name="titre" maxlength="120" required
                     placeholder="En une phrase, ce qui ne va pas">
            </div>

            <div class="grille grille-2">
              <div>
                <label class="etiquette-champ" for="type">Nature de la demande</label>
                <select class="champ" id="type" name="type"></select>
              </div>
              <div>
                <label class="etiquette-champ" for="urgence">Urgence</label>
                <select class="champ" id="urgence" name="urgence"></select>
              </div>
              <div>
                <label class="etiquette-champ" for="plateforme">Plateforme concernée</label>
                <select class="champ" id="plateforme" name="plateforme"></select>
              </div>
              <div>
                <label class="etiquette-champ" for="version">Version de l'application</label>
                <input class="champ" type="text" id="version" name="version" maxlength="40" placeholder="1.4.2">
              </div>
            </div>

            <div>
              <label class="etiquette-champ" for="description">Description <span class="t-3">(obligatoire)</span></label>
              <textarea class="zone" id="description" name="description" maxlength="6000" required
                        placeholder="Ce que vous avez constaté, et dans quel contexte."></textarea>
            </div>

            <div>
              <label class="etiquette-champ" for="etapes">Étapes pour reproduire</label>
              <textarea class="zone" id="etapes" name="etapes" maxlength="4000"
                        placeholder="1. J'ouvre l'application&#10;2. Je touche le bouton Compte&#10;3. ..."></textarea>
            </div>

            <div class="grille grille-2">
              <div>
                <label class="etiquette-champ" for="attendu">Résultat attendu</label>
                <textarea class="zone" id="attendu" name="attendu" maxlength="2000"
                          placeholder="Ce qui devrait se passer."></textarea>
              </div>
              <div>
                <label class="etiquette-champ" for="obtenu">Résultat obtenu</label>
                <textarea class="zone" id="obtenu" name="obtenu" maxlength="2000"
                          placeholder="Ce qui se passe vraiment."></textarea>
              </div>
            </div>

            <div>
              <span class="etiquette-champ" id="titre-depot">Captures et documents</span>
              <label class="depot" for="fichiers">
                <span id="texte-depot">Déposez vos fichiers ici, ou touchez pour les choisir.</span>
                <br><span class="t-micro t-3">Images et PDF, 10 Mo par fichier, 10 fichiers au maximum.</span>
                <input type="file" id="fichiers" name="fichiers" multiple
                       accept="image/*,application/pdf" aria-labelledby="titre-depot">
              </label>
              <div class="pieces" id="liste-fichiers" aria-live="polite"></div>
            </div>

            <div id="erreur-ticket" class="masque" role="alert"></div>

            <div class="rang">
              <button class="btn btn-principal" type="submit" id="envoyer-ticket">Envoyer le ticket</button>
              <button class="btn btn-fantome" type="button" id="annuler-ticket">Annuler</button>
            </div>

            <p class="t-micro t-3">
              Le numéro du ticket est attribué par notre système, quelques secondes après l'envoi.
            </p>
          </form>
        </section>

        <div class="filtres" id="filtres" role="group" aria-label="Filtrer les tickets"></div>

        <div class="liste-tickets" id="liste-tickets" aria-live="polite" aria-busy="true"></div>
      </section>

      <!-- ===== Vue Devis et factures ===== -->
      <section id="vue-documents" class="masque" style="margin-top:var(--e-6)">
        <h1 class="t-h2">Devis et factures</h1>

        <h2 class="t-h3" style="margin-top:var(--e-6)">Devis</h2>
        <div class="documents" id="liste-devis" aria-live="polite" style="margin-top:var(--e-3)"></div>

        <h2 class="t-h3" style="margin-top:var(--e-7)">Factures</h2>
        <div class="documents" id="liste-factures" aria-live="polite" style="margin-top:var(--e-3)"></div>
      </section>

    </main>
  </div>
</div>

<script src="./assets/config-suivi.js"></script>
<script src="../assets/js/theme.js"></script>
<script type="module" src="./assets/projet.js"></script>
</body>
</html>
