<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticket · Suivi Capmedia Digital</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/az.css">
<link rel="stylesheet" href="./assets/suivi.css">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-agence-32.png">
<script>(function(){try{var t=localStorage.getItem('az:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>

<a class="saut-contenu" href="#vue">Aller au contenu</a>

<div class="appli">

  <header class="appli-barre">
    <a class="appli-marque" href="../">
      <img class="marque" src="../assets/img/capmedia-digital.png" alt="" width="22" height="22">
      Capmedia&nbsp;Digital
    </a>
    <span class="separateur-barre" aria-hidden="true"></span>
    <a class="lien-discret t-petit" id="retour" href="./projet.html">Retour aux tickets</a>
    <div class="appli-fin">
      <span class="t-micro t-3 masque-etroit" id="courriel-compte"></span>
      <button class="btn btn-fantome" type="button" id="deconnexion">Se déconnecter</button>
    </div>
  </header>

  <main class="appli-vue" id="vue" style="max-width:820px;margin-inline:auto">

    <!-- Le temps de charger, puis le cas où le ticket est inaccessible -->
    <p class="t-petit t-3" id="chargement" aria-live="polite">Chargement du ticket...</p>
    <div id="souci" class="masque" role="alert"></div>

    <article id="fiche" class="masque">

      <!-- L'en-tête -->
      <header class="fiche-tete">
        <div style="min-width:0;flex:1 1 320px">
          <p class="ticket-numero" id="numero"></p>
          <h1 class="t-h2" id="titre" style="margin-top:var(--e-1);overflow-wrap:anywhere"></h1>
          <p class="ticket-meta" id="meta" style="margin-top:var(--e-3)"></p>
        </div>
        <div class="rang" id="etats"></div>
      </header>

      <!-- Ce que le client peut faire, et rien d'autre -->
      <div id="actions" aria-live="polite"></div>

      <!-- Le contenu du ticket -->
      <section class="panneau" aria-labelledby="titre-detail">
        <h2 class="t-h3" id="titre-detail">Le signalement</h2>
        <div id="detail" class="fiche-champs" style="margin-top:var(--e-4)"></div>
        <div class="pieces" id="pieces-ticket" style="margin-top:var(--e-4)"></div>
      </section>

      <!-- Le fil de discussion -->
      <section class="panneau" aria-labelledby="titre-fil">
        <h2 class="t-h3" id="titre-fil">Échanges</h2>
        <div class="fil" id="fil" aria-live="polite" aria-busy="true" style="margin-top:var(--e-5)"></div>

        <form id="forme-message" class="repondre" novalidate>
          <label class="etiquette-champ" for="texte">Votre réponse</label>
          <textarea class="zone" id="texte" name="texte" maxlength="6000"
                    placeholder="Écrivez ici. Une capture aide souvent plus qu'un paragraphe."></textarea>

          <div style="margin-top:var(--e-3)">
            <span class="etiquette-champ" id="titre-depot">Pièces jointes</span>
            <label class="depot" for="fichiers">
              <span id="texte-depot">Déposez vos fichiers ici, ou touchez pour les choisir.</span>
              <br><span class="t-micro t-3">Images et PDF, 10 Mo par fichier, 10 fichiers au maximum.</span>
              <input type="file" id="fichiers" name="fichiers" multiple
                     accept="image/*,application/pdf" aria-labelledby="titre-depot">
            </label>
            <div class="pieces" id="liste-fichiers" aria-live="polite"></div>
          </div>

          <div id="erreur-message" class="masque" role="alert"></div>

          <div class="rang" style="margin-top:var(--e-4)">
            <button class="btn btn-principal" type="submit" id="envoyer-message">Envoyer</button>
          </div>
        </form>
      </section>

      <!-- Le journal -->
      <section class="panneau panneau--creux" aria-labelledby="titre-historique">
        <h2 class="t-h3" id="titre-historique">Historique</h2>
        <ul class="historique" id="historique" aria-live="polite" style="margin-top:var(--e-4)"></ul>
      </section>

    </article>
  </main>
</div>

<script src="./assets/config-suivi.js"></script>
<script src="../assets/js/theme.js"></script>
<script type="module" src="./assets/ticket.js"></script>
</body>
</html>
