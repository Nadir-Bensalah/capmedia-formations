<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Redirection · Capmedia</title><meta name="robots" content="noindex, nofollow">
<script>
(function () {
  // L'ancienne adresse ne porte que l'identifiant du ticket : la page d'accueil
  // du hub retrouve le projet et ouvre la fiche.
  var t = new URLSearchParams(location.search).get('t');
  location.replace('./app' + (t ? '#/demande/' + encodeURIComponent(t) : ''));
})();
</script></head><body><p style="font-family:system-ui;padding:24px">Redirection vers votre espace...</p></body></html>
