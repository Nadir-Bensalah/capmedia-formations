# Maintenance FTP ponctuelle (Release Gate 1). À RETIRER après usage.
#
# Le déploiement Academy ne sait pas supprimer un dossier devenu obsolète sur
# ce serveur : l'action construit un chemin ABSOLU (« /academy/... ») que le
# FTP ne résout pas, alors qu'elle envoie et supprime les fichiers en chemin
# RELATIF. Ce workflow retire, une fois, exactement trois chemins :
#   academy/fonctions-suivi/   academy/suivi/   academy/.ftp-deploy-sync-state.json
#
# Lancement manuel seulement. Mode « inventaire » par défaut : rien n'est
# supprimé. Il faut taper SUPPRIMER pour supprimer, et seulement si les
# vérifications de chemin passent. Les chemins sont écrits en dur : aucune
# variable, aucun motif, rien au-dessus de academy/. Les identifiants viennent
# des secrets existants, par variables d'environnement, jamais affichés.

name: Maintenance FTP Gate 1 (ponctuelle)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inventaire (rien n'est supprimé) ou SUPPRIMER"
        required: true
        default: inventaire

concurrency:
  group: deploiement-capmedia
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Installation de lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null

      - name: Vérification des chemins, puis suppression bornée
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # Même sécurité que le déploiement existant (FTPS explicite, certificat non vérifié).
          ftp() { lftp -u "$FTP_USERNAME" --env-password -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set cmd:fail-exit yes; $1; bye" "$FTP_SERVER"; }

          echo "== Dossier d'arrivée et contenu de academy/"
          ftp "pwd; cls -1aF academy/" | tee racine.txt
          echo "== Signatures attendues"
          present() { grep -qx "$1" racine.txt && echo "  présent  $1" || { echo "  ABSENT   $1"; return 1; }; }
          ok=1
          present "academy/index.html" || ok=0
          present "academy/formations/" || ok=0
          present "academy/fonctions-suivi/" || ok=0
          present "academy/suivi/" || ok=0
          present "academy/.ftp-deploy-sync-state.json" || ok=0
          ftp "cls -1aF academy/fonctions-suivi/outils/" > outils.txt && grep -qx "academy/fonctions-suivi/outils/portefeuille.mjs" outils.txt && echo "  présent  academy/fonctions-suivi/outils/portefeuille.mjs" || { echo "  ABSENT   academy/fonctions-suivi/outils/portefeuille.mjs"; ok=0; }
          echo "  fichiers sous academy/fonctions-suivi/outils/ : $(wc -l < outils.txt)"
          echo "  entrées sous academy/suivi/ : $(ftp 'cls -1aF academy/suivi/' | wc -l)"

          echo "== État de synchronisation (copie, empreinte seulement dans le journal)"
          ftp "get academy/.ftp-deploy-sync-state.json -o etat.json"
          echo "  taille : $(wc -c < etat.json) octets"
          echo "  sha256 : $(sha256sum etat.json | cut -c1-16)"
          echo "  entrées : $(jq '.data | length' etat.json)"
          echo "  dossiers de premier niveau : $(jq -r '.data[].name' etat.json | cut -d/ -f1 | sort -u | tr '\n' ' ')"

          if [ "$ok" != 1 ]; then echo "Vérification incomplète : rien n'est supprimé."; exit 1; fi
          if [ "$MODE" != "SUPPRIMER" ]; then echo "Mode inventaire : rien n'est supprimé."; exit 0; fi

          echo "== Suppression des trois chemins, et d'eux seuls"
          ftp "rm -r academy/fonctions-suivi; rm -r academy/suivi; rm academy/.ftp-deploy-sync-state.json"
          echo "== Contenu de academy/ après suppression"
          ftp "cls -1aF academy/"
