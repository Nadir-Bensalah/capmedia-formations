# Déploiement du site agence Capmedia Digital vers la RACINE de capmedia.app.
# Le dossier agence/ du repo part dans public_html/ (l'Academy vit à côté,
# dans public_html/academy/, gérée par deploiement.yml : les deux workflows
# ont chacun leur fichier d'état FTP et ne se marchent pas dessus).

name: Déploiement agence capmedia.app

on:
  push:
    branches: [main]
    paths:
      - 'agence/**'
      - '.github/workflows/agence.yml'
  workflow_dispatch:

concurrency:
  group: deploiement-agence
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Estampille de version sur le JS et le CSS
        run: |
          python3 - "$GITHUB_SHA" <<'PY'
          import os, re, sys
          v = sys.argv[1][:8]
          motif = re.compile(r'((?:src|href)="[^"]*?assets/(?:js|css)/[^"?]+\.(?:js|css))"')
          touches = 0
          for racine, _, fichiers in os.walk('agence'):
              for f in fichiers:
                  if not f.endswith('.html'): continue
                  chemin = os.path.join(racine, f)
                  src = open(chemin, encoding='utf-8').read()
                  neuf, n = motif.subn(lambda m: f'{m.group(1)}?v={v}"', src)
                  if n:
                      open(chemin, 'w', encoding='utf-8').write(neuf)
                      touches += n
          print(f'{touches} références estampillées en v={v}')
          PY

      - name: Estampille de version sur les imports entre modules
        run: |
          python3 - "$GITHUB_SHA" <<'PY'
          import os, re, sys
          v = sys.argv[1][:8]
          # Le navigateur met en cache chaque module. Sans version sur les
          # imports relatifs, une mise en ligne ne change que le fichier
          # d'entree : tout le reste reste l'ancien. On estampille donc les
          # « from './x.js' » et les « import('./x.js') ».
          motif = re.compile(r"((?:from|import)\s*\(?\s*['\"])(\.{1,2}/[^'\"?]+\.js)(['\"])")
          touches = 0
          for racine, _, fichiers in os.walk('agence/suivi/assets/js'):
              for f in fichiers:
                  if not f.endswith('.js'): continue
                  chemin = os.path.join(racine, f)
                  src = open(chemin, encoding='utf-8').read()
                  neuf, n = motif.subn(lambda m: f'{m.group(1)}{m.group(2)}?v={v}{m.group(3)}', src)
                  if n:
                      open(chemin, 'w', encoding='utf-8').write(neuf)
                      touches += n
          print(f'{touches} import(s) estampilles en v={v}')

          # Le fichier d'entree, lui, est appele depuis le HTML. L'hebergeur
          # sert les .js avec un cache de sept jours : sans version dans la
          # balise, un navigateur venu cette semaine garde l'ancien script
          # avec la nouvelle page. C'est ainsi qu'une refonte de la page de
          # connexion a servi un script perime, et que la connexion cassait.
          # Le HTML, lui, est revalide a chaque visite : la balise estampillee
          # suffit donc a forcer le bon fichier.
          balise = re.compile(r'(src=\")((?:\.{1,2}/)[^\"?]+\.js)(\")')
          pages = 0
          for racine, _, fichiers in os.walk('agence/suivi'):
              for f in fichiers:
                  if not f.endswith('.html'): continue
                  chemin = os.path.join(racine, f)
                  src = open(chemin, encoding='utf-8').read()
                  neuf, n = balise.subn(lambda m: f'{m.group(1)}{m.group(2)}?v={v}{m.group(3)}', src)
                  if n:
                      open(chemin, 'w', encoding='utf-8').write(neuf)
                      pages += n
          print(f'{pages} balise(s) de script estampillee(s) en v={v}')
          PY

      - name: Envoi FTP vers la racine
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: agence/
          server-dir: ./
          state-name: .ftp-deploy-agence.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            blog-src/**
