# Déploiement automatique du site vers Hostinger (capmedia.app).
# Chaque poussée sur main envoie les fichiers publics dans public_html par FTP.
# Secrets requis (Settings > Secrets and variables > Actions) :
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD

name: Déploiement capmedia.app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement-capmedia
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      # Le CDN d'Hostinger impose 7 jours de cache sur le JS et le CSS, et
      # ignore les en-têtes du .htaccess : une correction mettait une semaine
      # à atteindre les visiteurs. On estampille donc chaque fichier avec le
      # numéro du commit : nouvelle adresse à chaque déploiement, donc
      # rechargement immédiat, sans dépendre de l'hébergeur.
      - name: Estampille de version sur le JS et le CSS
        run: |
          python3 - "$GITHUB_SHA" <<'PY'
          import os, re, sys
          v = sys.argv[1][:8]
          motif = re.compile(r'((?:src|href)="[^"]*?assets/(?:js|css)/[^"?]+\.(?:js|css))"')
          touches = 0
          for racine, _, fichiers in os.walk('.'):
              if '/.git' in racine: continue
              for f in fichiers:
                  if not f.endswith('.html'): continue
                  chemin = os.path.join(racine, f)
                  src = open(chemin, encoding='utf-8').read()
                  neuf, n = motif.subn(lambda m: f'{m.group(1)}?v={v}"', src)
                  if n:
                      open(chemin, 'w', encoding='utf-8').write(neuf)
                      touches += n
          print(f'{touches} références estampillées en v={v}')
          PY

      - name: Envoi FTP vers public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          server-dir: academy/
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            fonctions/**
            outils/**
            docs/**
            promo/**
            contenu/**
            contenu-en/**
            README.md
            firebase.json
            firestore.rules
