# Déploiement automatique du site vers Hostinger (capmedia.app).
# Chaque poussée sur main envoie les fichiers publics dans public_html par FTP.
# Secrets requis (Settings > Secrets and variables > Actions) :
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD

name: Déploiement capmedia.app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement-capmedia
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Nettoyage ponctuel (dossiers imbriqués par erreur)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get -y install lftp >/dev/null 2>&1
          lftp --env-password -u "$FTP_USER" \
            -e "set ftp:ssl-force true; set ssl:verify-certificate no; \
                rm -rf /public_html/public_html; \
                rm -f /public_html/academy/default.php; \
                echo '== apres nettoyage =='; cls -la /public_html/; \
                bye" "$FTP_HOST" || true

      - name: Envoi FTP vers public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          server-dir: academy/
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            fonctions/**
            outils/**
            docs/**
            promo/**
            contenu/**
            contenu-en/**
            README.md
            firebase.json
            firestore.rules
